<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诞生地 · 他们诞生的地方 | LUMI SONG</title>
  <meta name="description" content="Lumi Song 手作作品诞生地 — 他们诞生的地方。简单的家，不简单的手作。">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #FAF8F5;
      --bg-warm-oat: #F3EFEA;
      --bg-pure: #FFFFFF;
      --text-dark: #22201E;
      --text-muted: #686560;
      --text-light: #9E9A92;
      --line-subtle: #E6E0D6;
      --accent-terracotta: #9B634E;
      
      --font-display: 'Italiana', 'Noto Serif SC', serif;
      --font-body: 'Jost', 'Noto Serif SC', -apple-system, sans-serif;
      --font-serif: 'Noto Serif SC', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.8;
      letter-spacing: 0.02em;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      background: var(--bg-cream);
      border-bottom: 1px solid var(--line-subtle);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .nav-wrapper {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1.3rem 2rem;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .nav-left, .nav-right {
      display: flex;
      gap: 2.2rem;
      list-style: none;
      align-items: center;
    }

    .nav-right { justify-content: flex-end; }

    .nav-item a {
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.84rem;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      transition: color 0.25s ease;
    }

    .nav-item a:hover { color: var(--accent-terracotta); }

    .lang-switcher {
      display: inline-flex;
      border: 1px solid var(--line-subtle);
      border-radius: 20px;
      padding: 2px;
      background: var(--bg-pure);
    }

    .lang-btn {
      background: none;
      border: none;
      padding: 0.25rem 0.75rem;
      font-family: var(--font-body);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      border-radius: 16px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }

    .lang-btn.active {
      background: var(--text-dark);
      color: var(--bg-cream);
      font-weight: 500;
    }

    .brand-logo {
      text-align: center;
      text-decoration: none;
      color: var(--text-dark);
    }

    .brand-logo h1 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      line-height: 1;
    }

    .brand-logo span {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .mobile-header-actions {
      display: none;
      align-items: center;
      gap: 0.8rem;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: 1px solid var(--line-subtle);
      border-radius: 4px;
      width: 40px;
      height: 40px;
      padding: 8px;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      cursor: pointer;
      z-index: 1001;
    }

    .mobile-menu-btn span {
      display: block;
      width: 20px;
      height: 1.5px;
      background: var(--text-dark);
      transition: all 0.3s ease;
    }

    .mobile-drawer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: var(--bg-cream);
      z-index: 999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-drawer.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav-list {
      list-style: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }

    .mobile-nav-item a {
      text-decoration: none;
      font-family: var(--font-display);
      font-size: 1.65rem;
      color: var(--text-dark);
      letter-spacing: 0.1em;
      text-transform: lowercase;
      transition: color 0.2s ease;
    }

    .mobile-nav-item a:hover { color: var(--accent-terracotta); }

    /* Pure Minimalist Header Text */
    .birthplace-header-section {
      text-align: center;
      padding: 4rem 2rem 2.5rem;
      max-width: 900px;
      margin: 0 auto;
    }

    .birthplace-title {
      font-family: var(--font-display);
      font-size: 3.4rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--text-dark);
      margin-bottom: 0.6rem;
      line-height: 1.2;
    }

    .birthplace-sub {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--accent-terracotta);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .birthplace-divider {
      width: 50px;
      height: 1px;
      background: var(--accent-terracotta);
      margin: 0 auto;
    }

    /* Full-Screen Composite Image Frame */
    .birthplace-fullscreen-wrap {
      width: 100%;
      max-width: 1440px;
      margin: 1.5rem auto 4.5rem;
      padding: 0 1.5rem;
    }

    .birthplace-img-frame {
      width: 100%;
      background: var(--bg-warm-oat);
      border: 1px solid var(--line-subtle);
      box-shadow: 0 16px 40px rgba(34, 32, 30, 0.05);
      border-radius: 2px;
      overflow: hidden;
      cursor: zoom-in;
    }

    .birthplace-img-frame img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s ease;
    }

    .birthplace-img-frame:hover img {
      transform: scale(1.015);
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(34, 32, 30, 0.94);
      backdrop-filter: blur(10px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      cursor: zoom-out;
    }

    .lightbox.active { display: flex; }

    .lightbox img {
      max-width: 94vw;
      max-height: 92vh;
      border-radius: 2px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
    }

    footer {
      background: var(--bg-warm-oat);
      border-top: 1px solid var(--line-subtle);
      padding: 3.5rem 2rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-light);
      letter-spacing: 0.14em;
    }

    @media (max-width: 768px) {
      .nav-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 1.2rem;
      }
      .nav-left, .nav-right { display: none; }
      .mobile-header-actions { display: flex; }
      .mobile-menu-btn { display: flex; }
      .mobile-drawer { display: flex; }
      
      .brand-logo h1 { font-size: 1.65rem; }
      .brand-logo span { font-size: 0.58rem; }
      
      .birthplace-header-section { padding: 3rem 1.2rem 1.8rem; }
      .birthplace-title { font-size: 2.4rem; }
      .birthplace-sub { font-size: 1rem; letter-spacing: 0.12em; }
      .birthplace-fullscreen-wrap { padding: 0 0.8rem; margin-bottom: 3.5rem; }
    }
  </style>
</head>
<body>

  <!-- Editorial Navigation Header -->
  <header>
    <div class="nav-wrapper">
      <ul class="nav-left">
        <li class="nav-item"><a href="index.html#rag-dolls" data-i18n="nav_rag_dolls">艺术布偶</a></li>
        <li class="nav-item"><a href="index.html#bags" data-i18n="nav_bags">原创布包</a></li>
        <li class="nav-item"><a href="index.html#accessories" data-i18n="nav_living">宠物与生活</a></li>
      </ul>

      <a href="index.html" class="brand-logo">
        <h1>lumi song</h1>
        <span data-i18n="brand_sub">手作设计与工坊</span>
      </a>

      <ul class="nav-right">
        <li class="nav-item"><a href="about.html" data-i18n="nav_about">关于我</a></li>
        <li class="nav-item"><a href="visit.html" style="color:var(--accent-terracotta);" data-i18n="nav_birthplace">诞生地</a></li>
        <li class="nav-item"><a href="index.html#contact" data-i18n="nav_inquiries">合作洽谈</a></li>
        <li class="nav-item">
          <div class="lang-switcher">
            <button class="lang-btn active" id="btn-zh" onclick="setLanguage('zh')">中文</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
          </div>
        </li>
      </ul>

      <!-- Mobile Top Actions -->
      <div class="mobile-header-actions">
        <div class="lang-switcher">
          <button class="lang-btn active" id="btn-zh-top-m" onclick="setLanguage('zh')">中</button>
          <button class="lang-btn" id="btn-en-top-m" onclick="setLanguage('en')">EN</button>
        </div>
        <button class="mobile-menu-btn" id="mobile-toggle-btn" onclick="toggleMobileMenu()" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Fullscreen Drawer Navigation -->
  <div class="mobile-drawer" id="mobile-drawer">
    <ul class="mobile-nav-list">
      <li class="mobile-nav-item"><a href="index.html#rag-dolls" onclick="toggleMobileMenu()" data-i18n="nav_rag_dolls">艺术布偶</a></li>
      <li class="mobile-nav-item"><a href="index.html#bags" onclick="toggleMobileMenu()" data-i18n="nav_bags">原创布包</a></li>
      <li class="mobile-nav-item"><a href="index.html#accessories" onclick="toggleMobileMenu()" data-i18n="nav_living">宠物与生活</a></li>
      <li class="mobile-nav-item"><a href="about.html" onclick="toggleMobileMenu()" data-i18n="nav_about">关于我</a></li>
      <li class="mobile-nav-item"><a href="visit.html" onclick="toggleMobileMenu()" style="color:var(--accent-terracotta);" data-i18n="nav_birthplace">诞生地</a></li>
      <li class="mobile-nav-item"><a href="index.html#contact" onclick="toggleMobileMenu()" data-i18n="nav_inquiries">合作洽谈</a></li>
    </ul>

    <div class="lang-switcher" style="margin-top: 1rem;">
      <button class="lang-btn active" id="btn-zh-m" onclick="setLanguage('zh')">中文</button>
      <button class="lang-btn" id="btn-en-m" onclick="setLanguage('en')">EN</button>
    </div>
  </div>

  <!-- Pure Single Copy Header -->
  <main>
    <section class="birthplace-header-section">
      <h1 class="birthplace-title" data-i18n="birthplace_title">诞生地</h1>
      <p class="birthplace-sub" data-i18n="birthplace_sub">他们诞生的地方</p>
      <div class="birthplace-divider"></div>
    </section>

    <!-- Fullscreen Master Composite Image -->
    <section class="birthplace-fullscreen-wrap">
      <div class="birthplace-img-frame" onclick="openLightbox('images/studio/birthplace-full-mosaic.jpg')" title="点击放大查看全景细节">
        <img src="images/studio/birthplace-full-mosaic.jpg" alt="诞生地 · 他们诞生的地方 - Lumi Song" loading="eager">
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p data-i18n="footer_copy">© 2026 LUMI SONG (宋婷婷). 保留所有权利.</p>
    <p data-i18n="footer_sub">标志性高定艺术布偶 · 天然草木染织物 · 独立生活方式美学.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Zoomed view">
  </div>

  <!-- Multilingual Dictionary -->
  <script>
    const translations = {
      zh: {
        nav_rag_dolls: "艺术布偶",
        nav_bags: "原创布包",
        nav_living: "宠物与生活",
        brand_sub: "手作设计与工坊",
        nav_about: "关于我",
        nav_birthplace: "诞生地",
        nav_inquiries: "合作洽谈",
        
        birthplace_title: "诞生地",
        birthplace_sub: "他们诞生的地方",
        
        footer_copy: "© 2026 LUMI SONG (宋婷婷). 保留所有权利.",
        footer_sub: "标志性高定艺术布偶 · 天然草木染织物 · 独立生活方式美学."
      },
      en: {
        nav_rag_dolls: "rag dolls",
        nav_bags: "studio bags",
        nav_living: "pet & living",
        brand_sub: "design & atelier",
        nav_about: "about me",
        nav_birthplace: "birthplace",
        nav_inquiries: "inquiries",
        
        birthplace_title: "birthplace",
        birthplace_sub: "where they were born",
        
        footer_copy: "© 2026 LUMI SONG (TINGTING SONG). ALL RIGHTS RESERVED.",
        footer_sub: "INSPIRED BY ARTISAN RAG DOLLS, NATURAL BOTANICAL DYES & LIVING TEXTILES."
      }
    };

    let currentLang = localStorage.getItem('lumi_lang') || 'zh';

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lumi_lang', lang);
      
      const isZh = lang === 'zh';
      document.getElementById('btn-zh').classList.toggle('active', isZh);
      document.getElementById('btn-en').classList.toggle('active', !isZh);
      
      const btnZhTopM = document.getElementById('btn-zh-top-m');
      const btnEnTopM = document.getElementById('btn-en-top-m');
      if (btnZhTopM && btnEnTopM) {
        btnZhTopM.classList.toggle('active', isZh);
        btnEnTopM.classList.toggle('active', !isZh);
      }
      
      const btnZhM = document.getElementById('btn-zh-m');
      const btnEnM = document.getElementById('btn-en-m');
      if (btnZhM && btnEnM) {
        btnZhM.classList.toggle('active', isZh);
        btnEnM.classList.toggle('active', !isZh);
      }
      
      const t = translations[lang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
          el.innerHTML = t[key];
        }
      });
      
      document.documentElement.lang = isZh ? 'zh-CN' : 'en';
    }

    document.addEventListener('DOMContentLoaded', () => {
      setLanguage(currentLang);
    });

    function openLightbox(src) {
      const lb = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function toggleMobileMenu() {
      const drawer = document.getElementById('mobile-drawer');
      const btn = document.getElementById('mobile-toggle-btn');
      drawer.classList.toggle('active');
      const isOpen = drawer.classList.contains('active');
      document.body.style.overflow = isOpen ? 'hidden' : 'auto';
      
      if (isOpen) {
        btn.innerHTML = '<span style="transform:rotate(45deg) translate(4px, 4px);"></span><span style="opacity:0;"></span><span style="transform:rotate(-45deg) translate(4px, -4px);"></span>';
      } else {
        btn.innerHTML = '<span></span><span></span><span></span>';
      }
    }
  </script>

</body>
</html>
